# Example Apache reverse-proxy vhosts for a PathoCore/MEPRAM deployment.
# Replace *.example.org with real DNS names and enable HTTPS before production.

<VirtualHost *:80>
    ServerName mepram-datahub.example.org

    ErrorLog /var/log/local/pathocore-web/apache/error.log
    CustomLog /var/log/local/pathocore-web/apache/access.log combined

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

<VirtualHost *:80>
    ServerName api-pathocore.example.org

    ErrorLog /var/log/local/pathocore-api/apache/error.log
    CustomLog /var/log/local/pathocore-api/apache/access.log combined

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>

<VirtualHost *:80>
